name: ISOS-LC-3
reference: https://doi.org/10.1038/s41560-019-0529-5
notes: >-
  Light–dark cycling under a solar simulator at elevated temperature.
opto_electrical_channel:
  - voltage: {control: tracked, target: MPP, monitored: true}
    current_density: {monitored: true}
    notes: >-
      MPP tracking, mandatory "only at the third, most advanced level of ISOS protocols"
      (p. 37); it "measures the output" while it holds the point (p. 43).
  - light: solar_simulator
    voltage: {control: swept}
    current_density: {monitored: true}
    notes: >-
      Periodic J–V scan (p. 37) at an interval the standard does not state: it "depends
      on the characteristic degradation timescale of each given device" (p. 43).
options:
  - alternatives:
      - label: 65 °C
        thermal_channel:
          - temperature: {control: controlled, minimum: 65 °C, maximum: 65 °C}
      - label: 85 °C
        thermal_channel:
          - temperature: {control: controlled, minimum: 85 °C, maximum: 85 °C}
  - notes: >-
      Provisional: the paper contradicts itself about the humidity. Table 1 gives "< 50%";
      the text says "At the ISOS-LC-3 level, RH is held at 50% and high temperatures"
      (p. 39); Fig. 3 files ISOS-LC-3 under "Controlled RH = 85 or 50%". Both readings are
      variants until this is settled.
    alternatives:
      - label: RH 50 %
        atmosphere_channel:
          - gas: air
            relative_humidity: {control: controlled, minimum: 50 %, maximum: 50 %}
            oxygen_fraction: {control: ambient}
      - label: RH < 50 %
        atmosphere_channel:
          - gas: air
            relative_humidity: {control: specified, maximum: 50 %}
            oxygen_fraction: {control: ambient}
  - notes: >-
      "Cycle periods of 2, 8, or 24 h and duty cycles (light:dark) of 1:1 or 1:2" (p. 39).
      The light is on for the active duration of each period and off for the rest. "Ideally,
      light sources with an irradiance of 800–1000 W m–² (1 sun = 1000 W m–²) should be
      applied" (p. 43), read as the range the light is held in.
    alternatives:
      - label: 2 h, 1:1
        opto_electrical_channel:
          - light: solar_simulator
            irradiance: {control: controlled, minimum: 800 W/m^2, maximum: 1000 W/m^2}
            period: 2 hour
            active_duration: 1 hour
      - label: 2 h, 1:2
        opto_electrical_channel:
          - light: solar_simulator
            irradiance: {control: controlled, minimum: 800 W/m^2, maximum: 1000 W/m^2}
            period: 2 hour
            active_duration: 40 minute
      - label: 8 h, 1:1
        opto_electrical_channel:
          - light: solar_simulator
            irradiance: {control: controlled, minimum: 800 W/m^2, maximum: 1000 W/m^2}
            period: 8 hour
            active_duration: 4 hour
      - label: 8 h, 1:2
        opto_electrical_channel:
          - light: solar_simulator
            irradiance: {control: controlled, minimum: 800 W/m^2, maximum: 1000 W/m^2}
            period: 8 hour
            active_duration: 160 minute
      - label: 24 h, 1:1
        opto_electrical_channel:
          - light: solar_simulator
            irradiance: {control: controlled, minimum: 800 W/m^2, maximum: 1000 W/m^2}
            period: 24 hour
            active_duration: 12 hour
      - label: 24 h, 1:2
        opto_electrical_channel:
          - light: solar_simulator
            irradiance: {control: controlled, minimum: 800 W/m^2, maximum: 1000 W/m^2}
            period: 24 hour
            active_duration: 8 hour
