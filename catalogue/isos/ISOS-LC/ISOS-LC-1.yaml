name: ISOS-LC-1
reference: https://doi.org/10.1038/s41560-019-0529-5
notes: >-
  Light–dark cycling under a solar simulator in ambient air; "the temperature and RH are
  monitored, but not controlled" (p. 39).
thermal_channel:
  - temperature: {control: ambient, target: RT, minimum: 19 °C, maximum: 27 °C, monitored: true}
    notes: Room temperature, "assumed to be 23±4 °C" (p. 36).
atmosphere_channel:
  - gas: air
    relative_humidity: {control: ambient, monitored: true}
    oxygen_fraction: {control: ambient}
opto_electrical_channel:
  - light: solar_simulator
    voltage: {control: swept}
    current_density: {monitored: true}
    notes: >-
      Periodic J–V scan (p. 37) at an interval the standard does not state: it "depends
      on the characteristic degradation timescale of each given device" (p. 43).
options:
  - notes: >-
      "Options of exposure under open-circuit condition or using a fixed voltage bias near
      the MPP (instead of active MPP tracking)" (p. 37); MPP tracking is "encouraged …
      whenever possible" (p. 37).
    alternatives:
      - label: MPP
        opto_electrical_channel:
          - voltage: {control: tracked, target: MPP, monitored: true}
            current_density: {monitored: true}
            notes: MPP tracking "measures the output" while it holds the point (p. 43).
      - label: OC
        opto_electrical_channel:
          - current_density: {control: set, minimum: 0 A/m^2, maximum: 0 A/m^2}
            notes: Open circuit.
      - label: fixed voltage near MPP
        opto_electrical_channel:
          - voltage: {control: set, target: near V_MPP}
  - notes: >-
      "Cycle periods of 2, 8, or 24 h and duty cycles (light:dark) of 1:1 or 1:2" (p. 39).
      The light is on for the active duration of each period and off for the rest. "Ideally,
      light sources with an irradiance of 800–1000 W m–² (1 sun = 1000 W m–²) should be
      applied" (p. 43), read as the range the light is held in.
    alternatives:
      - label: 2 h, 1:1
        opto_electrical_channel:
          - light: solar_simulator
            irradiance: {control: controlled, minimum: 800 W/m^2, maximum: 1000 W/m^2}
            period: 2 hour
            active_duration: 1 hour
      - label: 2 h, 1:2
        opto_electrical_channel:
          - light: solar_simulator
            irradiance: {control: controlled, minimum: 800 W/m^2, maximum: 1000 W/m^2}
            period: 2 hour
            active_duration: 40 minute
      - label: 8 h, 1:1
        opto_electrical_channel:
          - light: solar_simulator
            irradiance: {control: controlled, minimum: 800 W/m^2, maximum: 1000 W/m^2}
            period: 8 hour
            active_duration: 4 hour
      - label: 8 h, 1:2
        opto_electrical_channel:
          - light: solar_simulator
            irradiance: {control: controlled, minimum: 800 W/m^2, maximum: 1000 W/m^2}
            period: 8 hour
            active_duration: 160 minute
      - label: 24 h, 1:1
        opto_electrical_channel:
          - light: solar_simulator
            irradiance: {control: controlled, minimum: 800 W/m^2, maximum: 1000 W/m^2}
            period: 24 hour
            active_duration: 12 hour
      - label: 24 h, 1:2
        opto_electrical_channel:
          - light: solar_simulator
            irradiance: {control: controlled, minimum: 800 W/m^2, maximum: 1000 W/m^2}
            period: 24 hour
            active_duration: 8 hour
