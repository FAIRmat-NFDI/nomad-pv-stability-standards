name: ISOS-D-1
reference: https://doi.org/10.1038/s41560-019-0529-5
notes: >-
  Dark storage in ambient air. "The cell environment is monitored but not explicitly
  controlled (room temperature in the laboratory is assumed to be 23±4 °C)" (p. 36), and
  "monitoring and reporting the ambient relative humidity (RH) is of critical
  importance" (p. 36).
thermal_channel:
  - temperature: {control: ambient, target: RT, minimum: 19 °C, maximum: 27 °C, monitored: true}
atmosphere_channel:
  - gas: air
    relative_humidity: {control: ambient, monitored: true}
    oxygen_fraction: {control: ambient}
opto_electrical_channel:
  - light: dark
    current_density: {control: set, minimum: 0 A/m^2, maximum: 0 A/m^2}
    notes: Open circuit in the dark.
options:
  - notes: >-
      Periodic J–V scans (p. 37) at an interval the standard does not state: it "depends
      on the characteristic degradation timescale of each given device" (p. 43). The
      characterization light source is a "Solar simulator or sunlight" (Table 1).
    alternatives:
      - label: J–V under solar simulator
        opto_electrical_channel:
          - light: solar_simulator
            voltage: {control: swept}
            current_density: {monitored: true}
            notes: Periodic J–V scan.
      - label: J–V under sunlight
        opto_electrical_channel:
          - light: sunlight
            voltage: {control: swept}
            current_density: {monitored: true}
            notes: Periodic J–V scan.
