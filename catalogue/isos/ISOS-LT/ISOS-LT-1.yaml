name: ISOS-LT-1
reference: https://doi.org/10.1038/s41560-019-0529-5
notes: >-
  Solar-thermal cycling in a weathering chamber. Table 1 gives the light as "Solar simulator", while Fig. 3 places ISOS-LT under "Light: cycled"; the light follows Table 1 and is held throughout.
atmosphere_channel:
  - gas: air
    relative_humidity: {control: ambient, monitored: true}
    oxygen_fraction: {control: ambient}
    notes: The relative humidity is "Monitored, uncontrolled" (Table 1).
opto_electrical_channel:
  - light: solar_simulator
    irradiance: {control: controlled, minimum: 800 W/m^2, maximum: 1000 W/m^2}
    notes: >-
      "Ideally, light sources with an irradiance of 800–1000 W m–² (1 sun = 1000 W m–²)
      should be applied" (p. 43), read as the range the light is held in.
  - light: solar_simulator
    voltage: {control: swept}
    current_density: {monitored: true}
    notes: >-
      Periodic J–V scan (p. 37) at an interval the standard does not state: it "depends
      on the characteristic degradation timescale of each given device" (p. 43).
options:
  - notes: >-
      "Linear or step ramping" (Table 1) between room temperature, read as 23 °C ("23±4
      °C", p. 36), and 65 °C.
    alternatives:
      - label: linear ramping
        thermal_channel:
          - temperature: {control: cycled, target: RT, minimum: 23 °C, maximum: 65 °C}
            notes: Ramped linearly up and down; rate and period are not stated.
      - label: step ramping
        thermal_channel:
          - temperature: {control: cycled, target: RT, minimum: 23 °C, maximum: 65 °C}
            notes: Ramped in steps; steps, dwell times and period are not stated.
  - notes: >-
      "Options of exposure under open-circuit condition or using a fixed voltage bias near
      the MPP (instead of active MPP tracking)" (p. 37); MPP tracking is "encouraged …
      whenever possible" (p. 37).
    alternatives:
      - label: MPP
        opto_electrical_channel:
          - voltage: {control: tracked, target: MPP, monitored: true}
            current_density: {monitored: true}
            notes: MPP tracking "measures the output" while it holds the point (p. 43).
      - label: OC
        opto_electrical_channel:
          - current_density: {control: set, minimum: 0 A/m^2, maximum: 0 A/m^2}
            notes: Open circuit.
      - label: fixed voltage near MPP
        opto_electrical_channel:
          - voltage: {control: set, target: near V_MPP}
