name: ISOS-V-3
reference: https://doi.org/10.1038/s41560-019-0529-5
notes: >-
  In the dark in an environmental chamber. Electrical bias in the dark.
atmosphere_channel:
  - gas: air
    relative_humidity: {control: controlled, minimum: 85 %, maximum: 85 %}
    oxygen_fraction: {control: ambient}
opto_electrical_channel:
  - light: dark
    notes: The bias is applied in the dark.
  - light: solar_simulator
    irradiance: {control: controlled, minimum: 1000 W/m^2, maximum: 1000 W/m^2}
    voltage: {control: swept}
    current_density: {monitored: true}
    notes: >-
      Once, on the fresh device, before the test: the biases are "determined from light
      J–V curves measured under standard solar cell testing conditions on a fresh device"
      (Table 1, footnote a), "under AM1.5G one sun illumination" (p. 39).
  - light: solar_simulator
    voltage: {control: swept}
    current_density: {monitored: true}
    notes: >-
      Periodic J–V scan (p. 37) at an interval the standard does not state: it "depends
      on the characteristic degradation timescale of each given device" (p. 43).
options:
  - alternatives:
      - label: 65 °C
        thermal_channel:
          - temperature: {control: controlled, minimum: 65 °C, maximum: 65 °C}
      - label: 85 °C
        thermal_channel:
          - temperature: {control: controlled, minimum: 85 °C, maximum: 85 °C}
  - notes: >-
      Table 1 also lists E_g/q among the positive biases, but the text recommends
      "voltages below the bandgap energy divided by the charge of the electron to avoid
      unnatural overstressing" (p. 39): E_g/q is read as an upper limit, not as a bias.
      The negative voltage is "for example, −VOC" (p. 39), and the negative current is
      "the current enforced up to −JMPP" (p. 39), which Table 1 writes as JMPP.
    alternatives:
      - label: V_MPP
        opto_electrical_channel:
          - voltage: {control: set, target: V_MPP}
      - label: V_oc
        opto_electrical_channel:
          - voltage: {control: set, target: V_oc}
      - label: J_SC
        opto_electrical_channel:
          - current_density: {control: set, target: J_SC}
      - label: −V_oc
        opto_electrical_channel:
          - voltage: {control: set, target: −V_oc}
      - label: −J_MPP
        opto_electrical_channel:
          - current_density: {control: set, target: −J_MPP}
