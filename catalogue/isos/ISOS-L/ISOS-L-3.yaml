name: ISOS-L-3
reference: https://doi.org/10.1038/s41560-019-0529-5
notes: >-
  Light soaking under a solar simulator at elevated temperature and controlled humidity.
  Table 1's "~ 50%" relative humidity is written as 50 %.
atmosphere_channel:
  - gas: air
    relative_humidity: {control: controlled, minimum: 50 %, maximum: 50 %}
    oxygen_fraction: {control: ambient}
opto_electrical_channel:
  - light: solar_simulator
    irradiance: {control: controlled, minimum: 800 W/m^2, maximum: 1000 W/m^2}
    notes: >-
      "Ideally, light sources with an irradiance of 800–1000 W m–² (1 sun = 1000 W m–²)
      should be applied" (p. 43), read as the range the light is held in.
  - voltage: {control: tracked, target: MPP, monitored: true}
    current_density: {monitored: true}
    notes: >-
      MPP tracking, mandatory "only at the third, most advanced level of ISOS protocols"
      (p. 37); it "measures the output" while it holds the point (p. 43).
  - light: solar_simulator
    voltage: {control: swept}
    current_density: {monitored: true}
    notes: >-
      Periodic J–V scan (p. 37) at an interval the standard does not state: it "depends
      on the characteristic degradation timescale of each given device" (p. 43).
options:
  - alternatives:
      - label: 65 °C
        thermal_channel:
          - temperature: {control: controlled, minimum: 65 °C, maximum: 65 °C}
      - label: 85 °C
        thermal_channel:
          - temperature: {control: controlled, minimum: 85 °C, maximum: 85 °C}
