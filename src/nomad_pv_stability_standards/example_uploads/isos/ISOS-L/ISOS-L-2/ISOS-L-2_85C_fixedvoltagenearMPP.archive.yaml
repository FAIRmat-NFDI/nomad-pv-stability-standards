data:
  m_def: nomad_pv_stability_standards.schema_packages.standard.StabilityStandard
  name: ISOS-L-2
  variant: 85 °C, fixed voltage near MPP
  reference: https://doi.org/10.1038/s41560-019-0529-5
  notes: 'Light soaking under a solar simulator at elevated temperature in ambient
    air.


    "Options of exposure under open-circuit condition or using a fixed voltage bias
    near the MPP (instead of active MPP tracking)" (p. 37); MPP tracking is "encouraged
    … whenever possible" (p. 37).'
  thermal_channel:
  - temperature:
      control: controlled
      minimum: 358.15
      maximum: 358.15
  opto_electrical_channel:
  - notes: '"Ideally, light sources with an irradiance of 800–1000 W m–² (1 sun =
      1000 W m–²) should be applied" (p. 43), read as the range the light is held
      in.'
    light: solar_simulator
    irradiance:
      control: controlled
      minimum: 800.0
      maximum: 1000.0
  - notes: 'Periodic J–V scan (p. 37) at an interval the standard does not state:
      it "depends on the characteristic degradation timescale of each given device"
      (p. 43).'
    light: solar_simulator
    voltage:
      control: swept
    current_density:
      monitored: true
  - voltage:
      control: set
      target: near V_MPP
  atmosphere_channel:
  - gas: air
    relative_humidity:
      control: ambient
      monitored: true
    oxygen_fraction:
      control: ambient
