data:
  m_def: nomad_pv_stability_standards.schema_packages.standard.StabilityStandard
  name: ISOS-D-1
  variant: J–V under solar simulator
  reference: https://doi.org/10.1038/s41560-019-0529-5
  notes: 'Dark storage in ambient air. "The cell environment is monitored but not
    explicitly controlled (room temperature in the laboratory is assumed to be 23±4
    °C)" (p. 36), and "monitoring and reporting the ambient relative humidity (RH)
    is of critical importance" (p. 36).


    Periodic J–V scans (p. 37) at an interval the standard does not state: it "depends
    on the characteristic degradation timescale of each given device" (p. 43). The
    characterization light source is a "Solar simulator or sunlight" (Table 1).'
  thermal_channel:
  - temperature:
      control: ambient
      monitored: true
      target: RT
      minimum: 292.15
      maximum: 300.15
  opto_electrical_channel:
  - notes: Open circuit in the dark.
    light: dark
    current_density:
      control: set
      minimum: 0.0
      maximum: 0.0
  - notes: Periodic J–V scan.
    light: solar_simulator
    voltage:
      control: swept
    current_density:
      monitored: true
  atmosphere_channel:
  - gas: air
    relative_humidity:
      control: ambient
      monitored: true
    oxygen_fraction:
      control: ambient
