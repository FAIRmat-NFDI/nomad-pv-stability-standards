data:
  m_def: nomad_pv_stability_standards.schema_packages.standard.StabilityStandard
  name: ISOS-D-2
  variant: 85 °C
  reference: https://doi.org/10.1038/s41560-019-0529-5
  notes: Dark storage in an oven in ambient air. "Monitoring and reporting the ambient
    relative humidity (RH) is of critical importance" (p. 36).
  thermal_channel:
  - temperature:
      control: controlled
      minimum: 358.15
      maximum: 358.15
  opto_electrical_channel:
  - notes: Open circuit in the dark.
    light: dark
    current_density:
      control: set
      minimum: 0.0
      maximum: 0.0
  - notes: 'Periodic J–V scan (p. 37) at an interval the standard does not state:
      it "depends on the characteristic degradation timescale of each given device"
      (p. 43).'
    light: solar_simulator
    voltage:
      control: swept
    current_density:
      monitored: true
  atmosphere_channel:
  - gas: air
    relative_humidity:
      control: ambient
      monitored: true
    oxygen_fraction:
      control: ambient
