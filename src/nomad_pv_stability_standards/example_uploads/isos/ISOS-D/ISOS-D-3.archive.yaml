data:
  m_def: nomad_pv_stability_standards.schema_packages.standard.StabilityStandard
  name: ISOS-D-3
  reference: https://doi.org/10.1038/s41560-019-0529-5
  notes: 'Damp heat: dark storage in an environmental chamber.

    Options, chosen when the standard is applied: Temperature: 65 °C or 85 °C.'
  opto_electrical_channel:
  - notes: Open circuit in the dark.
    light: dark
    current_density:
      control: set
      minimum: 0.0
      maximum: 0.0
  - notes: 'Periodic J–V scan (p. 37) at an interval the standard does not state:
      it "depends on the characteristic degradation timescale of each given device"
      (p. 43).'
    light: solar_simulator
    voltage:
      control: swept
    current_density:
      monitored: true
  atmosphere_channel:
  - notes: In the dark, the device takes the temperature of the chamber, which is
      an option, and at which the relative humidity is controlled.
    gas: air
    temperature:
      control: controlled
    relative_humidity:
      control: controlled
      minimum: 0.85  # 85 %
      maximum: 0.85  # 85 %
    oxygen_fraction:
      control: ambient
