data:
  m_def: nomad_pv_stability_standards.schema_packages.standard.StabilityStandard
  name: ISOS-V-2
  variant: 85 °C, J_SC
  reference: https://doi.org/10.1038/s41560-019-0529-5
  notes: 'In the dark in an oven in ambient air. Electrical bias in the dark.


    Table 1 also lists E_g/q among the positive biases, but the text recommends "voltages
    below the bandgap energy divided by the charge of the electron to avoid unnatural
    overstressing" (p. 39): E_g/q is read as an upper limit, not as a bias. The negative
    voltage is "for example, −VOC" (p. 39), and the negative current is "the current
    enforced up to −JMPP" (p. 39), which Table 1 writes as JMPP.'
  thermal_channel:
  - temperature:
      control: controlled
      minimum: 358.15
      maximum: 358.15
  opto_electrical_channel:
  - notes: The bias is applied in the dark.
    light: dark
  - notes: 'Once, on the fresh device, before the test: the biases are "determined
      from light J–V curves measured under standard solar cell testing conditions
      on a fresh device" (Table 1, footnote a), "under AM1.5G one sun illumination"
      (p. 39).'
    light: solar_simulator
    irradiance:
      control: controlled
      minimum: 1000.0
      maximum: 1000.0
    voltage:
      control: swept
    current_density:
      monitored: true
  - notes: 'Periodic J–V scan (p. 37) at an interval the standard does not state:
      it "depends on the characteristic degradation timescale of each given device"
      (p. 43).'
    light: solar_simulator
    voltage:
      control: swept
    current_density:
      monitored: true
  - current_density:
      control: set
      target: J_SC
  atmosphere_channel:
  - gas: air
    relative_humidity:
      control: ambient
      monitored: true
    oxygen_fraction:
      control: ambient
