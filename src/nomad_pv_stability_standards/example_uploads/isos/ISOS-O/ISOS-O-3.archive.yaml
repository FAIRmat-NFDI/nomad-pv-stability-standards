data:
  m_def: nomad_pv_stability_standards.schema_packages.standard.StabilityStandard
  name: ISOS-O-3
  reference: https://doi.org/10.1038/s41560-019-0529-5
  notes: 'Outdoors: "in situ MPP tracking under natural sunlight and periodic performance
    measurements under a solar simulator" (p. 37). Table 1 gives the characterization
    light source as "Sunlight and Solar simulator"; the J–V scans follow the text.'
  thermal_channel:
  - temperature:
      control: ambient
      monitored: true
  opto_electrical_channel:
  - notes: 'The weather is logged: "Temperature, humidity, sunlight irradiance (preferably
      in tabulated format)" (Table 3).'
    light: sunlight
    irradiance:
      control: ambient
      monitored: true
  - notes: MPP tracking, mandatory "only at the third, most advanced level of ISOS
      protocols" (p. 37); it "measures the output" while it holds the point (p. 43).
    voltage:
      control: tracked
      monitored: true
      target: MPP
    current_density:
      monitored: true
  - notes: 'Periodic J–V scan (p. 37) at an interval the standard does not state:
      it "depends on the characteristic degradation timescale of each given device"
      (p. 43).'
    light: solar_simulator
    voltage:
      control: swept
    current_density:
      monitored: true
  atmosphere_channel:
  - gas: air
    relative_humidity:
      control: ambient
      monitored: true
    oxygen_fraction:
      control: ambient
