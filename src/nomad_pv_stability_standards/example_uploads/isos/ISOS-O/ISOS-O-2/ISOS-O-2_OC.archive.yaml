data:
  m_def: nomad_pv_stability_standards.schema_packages.standard.StabilityStandard
  name: ISOS-O-2
  variant: OC
  reference: https://doi.org/10.1038/s41560-019-0529-5
  notes: 'Outdoors under sunlight; J–V scans under natural sunlight.


    "Options of exposure under open-circuit condition or using a fixed voltage bias
    near the MPP (instead of active MPP tracking)" (p. 37); MPP tracking is "encouraged
    … whenever possible" (p. 37).'
  thermal_channel:
  - temperature:
      control: ambient
      monitored: true
  opto_electrical_channel:
  - notes: 'The weather is logged: "Temperature, humidity, sunlight irradiance (preferably
      in tabulated format)" (Table 3).'
    light: sunlight
    irradiance:
      control: ambient
      monitored: true
  - notes: 'Periodic J–V scan under natural sunlight (Table 1), at an interval the
      standard does not state: it "depends on the characteristic degradation timescale
      of each given device" (p. 43).'
    light: sunlight
    voltage:
      control: swept
    current_density:
      monitored: true
  - notes: Open circuit.
    current_density:
      control: set
      minimum: 0.0
      maximum: 0.0
  atmosphere_channel:
  - gas: air
    relative_humidity:
      control: ambient
      monitored: true
    oxygen_fraction:
      control: ambient
