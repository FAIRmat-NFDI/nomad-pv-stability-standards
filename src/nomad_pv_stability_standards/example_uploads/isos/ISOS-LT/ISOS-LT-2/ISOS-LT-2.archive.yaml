data:
  m_def: nomad_pv_stability_standards.schema_packages.standard.StabilityStandard
  name: ISOS-LT-2
  reference: https://doi.org/10.1038/s41560-019-0529-5
  notes: 'Solar-thermal cycling in an environmental chamber. Table 1 gives the light
    as "Solar simulator", while Fig. 3 places ISOS-LT under "Light: cycled"; the light
    follows Table 1 and is held throughout.


    "Options of exposure under open-circuit condition or using a fixed voltage bias
    near the MPP (instead of active MPP tracking)" (p. 37); MPP tracking is "encouraged
    … whenever possible" (p. 37).


    Options, one variant per combination: MPP or OC or fixed voltage near MPP.'
  thermal_channel:
  - notes: 'Path, rate, dwell times and period of the cycle are not stated: "Examples
      of such cycles are available elsewhere" (p. 38), in Reese et al., Sol. Energy
      Mater. Sol. Cells 95, 1253–1267 (2011), https://doi.org/10.1016/j.solmat.2011.01.036.'
    temperature:
      control: cycled
      minimum: 278.15
      maximum: 338.15
  opto_electrical_channel:
  - notes: '"Ideally, light sources with an irradiance of 800–1000 W m–² (1 sun =
      1000 W m–²) should be applied" (p. 43), read as the range the light is held
      in.'
    light: solar_simulator
    irradiance:
      control: controlled
      minimum: 800.0
      maximum: 1000.0
  - notes: 'Periodic J–V scan (p. 37) at an interval the standard does not state:
      it "depends on the characteristic degradation timescale of each given device"
      (p. 43).'
    light: solar_simulator
    voltage:
      control: swept
    current_density:
      monitored: true
  atmosphere_channel:
  - notes: '"Monitored, controlled at 50% beyond 40 °C" (Table 1): held only above
      40 °C.'
    gas: air
    relative_humidity:
      control: specified
      monitored: true
      minimum: 0.5
      maximum: 0.5
    oxygen_fraction:
      control: ambient
