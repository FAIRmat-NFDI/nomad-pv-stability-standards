data:
  m_def: nomad_pv_stability_standards.schema_packages.standard.StabilityStandard
  name: ISOS-LT-1
  variant: step ramping, MPP
  reference: https://doi.org/10.1038/s41560-019-0529-5
  notes: 'Solar-thermal cycling in a weathering chamber. Table 1 gives the light as
    "Solar simulator", while Fig. 3 places ISOS-LT under "Light: cycled"; the light
    follows Table 1 and is held throughout.


    "Linear or step ramping" (Table 1) between room temperature, read as 23 °C ("23±4
    °C", p. 36), and 65 °C.


    "Options of exposure under open-circuit condition or using a fixed voltage bias
    near the MPP (instead of active MPP tracking)" (p. 37); MPP tracking is "encouraged
    … whenever possible" (p. 37).'
  thermal_channel:
  - notes: Ramped in steps; steps, dwell times and period are not stated.
    temperature:
      control: cycled
      target: RT
      minimum: 296.15
      maximum: 338.15
  opto_electrical_channel:
  - notes: '"Ideally, light sources with an irradiance of 800–1000 W m–² (1 sun =
      1000 W m–²) should be applied" (p. 43), read as the range the light is held
      in.'
    light: solar_simulator
    irradiance:
      control: controlled
      minimum: 800.0
      maximum: 1000.0
  - notes: 'Periodic J–V scan (p. 37) at an interval the standard does not state:
      it "depends on the characteristic degradation timescale of each given device"
      (p. 43).'
    light: solar_simulator
    voltage:
      control: swept
    current_density:
      monitored: true
  - notes: MPP tracking "measures the output" while it holds the point (p. 43).
    voltage:
      control: tracked
      monitored: true
      target: MPP
    current_density:
      monitored: true
  atmosphere_channel:
  - notes: The relative humidity is "Monitored, uncontrolled" (Table 1).
    gas: air
    relative_humidity:
      control: ambient
      monitored: true
    oxygen_fraction:
      control: ambient
