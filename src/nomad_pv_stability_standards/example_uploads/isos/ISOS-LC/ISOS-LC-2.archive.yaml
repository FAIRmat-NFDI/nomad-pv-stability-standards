data:
  m_def: nomad_pv_stability_standards.schema_packages.standard.StabilityStandard
  name: ISOS-LC-2
  reference: https://doi.org/10.1038/s41560-019-0529-5
  notes: 'Light–dark cycling under a solar simulator at elevated temperature.

    Options, chosen when the standard is applied: Temperature: 65 °C or 85 °C; Electrical
    load: MPP, OC or fixed voltage near MPP; Light–dark cycle: a period of 2, 8 or
    24 h, each with light:dark 1:1 or 1:2.

    "Options of exposure under open-circuit condition or using a fixed voltage bias
    near the MPP (instead of active MPP tracking)" (p. 37); MPP tracking is "encouraged
    … whenever possible" (p. 37).

    "Cycle periods of 2, 8, or 24 h and duty cycles (light:dark) of 1:1 or 1:2" (p.
    39).'
  opto_electrical_channel:
  - notes: 'Periodic J–V scan (p. 37) at an interval the standard does not state:
      it "depends on the characteristic degradation timescale of each given device"
      (p. 43).'
    light: solar_simulator
    voltage:
      control: swept
    current_density:
      monitored: true
  - notes: Light phases of a light–dark cycle; period and duty cycle are options.
      "Ideally, light sources with an irradiance of 800–1000 W m–² (1 sun = 1000 W
      m–²) should be applied" (p. 43), read as the range the light is held in.
    light: solar_simulator
    irradiance:
      control: controlled
      minimum: 800.0
      maximum: 1000.0
  atmosphere_channel:
  - gas: air
    relative_humidity:
      control: ambient
      monitored: true
    oxygen_fraction:
      control: ambient
