data:
  m_def: nomad_pv_stability_standards.schema_packages.standard.StabilityStandard
  name: ISOS-LC-3
  reference: https://doi.org/10.1038/s41560-019-0529-5
  notes: 'Light–dark cycling under a solar simulator at elevated temperature.

    Options, chosen when the standard is applied: Temperature: 65 °C or 85 °C; Light–dark
    cycle: a period of 2, 8 or 24 h, each with light:dark 1:1 or 1:2.

    "Cycle periods of 2, 8, or 24 h and duty cycles (light:dark) of 1:1 or 1:2" (p.
    39).'
  opto_electrical_channel:
  - notes: MPP tracking, mandatory "only at the third, most advanced level of ISOS
      protocols" (p. 37); it "measures the output" while it holds the point (p. 43).
    voltage:
      control: tracked
      monitored: true
      target: MPP
    current_density:
      monitored: true
  - notes: 'Periodic J–V scan (p. 37) at an interval the standard does not state:
      it "depends on the characteristic degradation timescale of each given device"
      (p. 43).'
    light: solar_simulator
    voltage:
      control: swept
    current_density:
      monitored: true
  - notes: Light phases of a light–dark cycle; period and duty cycle are options.
      "Ideally, light sources with an irradiance of 800–1000 W m–² (1 sun = 1000 W
      m–²) should be applied" (p. 43), read as the range the light is held in.
    light: solar_simulator
    irradiance:
      control: controlled
      minimum: 800.0
      maximum: 1000.0
  atmosphere_channel:
  - notes: 'Provisional: the paper contradicts itself about the humidity. Table 1
      gives "< 50%", a limit; the text says "At the ISOS-LC-3 level, RH is held at
      50% and high temperatures" (p. 39), and Fig. 3 files ISOS-LC-3 under "Controlled
      RH = 85 or 50%", a held value. The control stays empty until this is settled;
      an applied standard states the reading it followed: held at 50 % or below 50
      %.'
    gas: air
    relative_humidity:
      maximum: 0.5  # 50 %
    oxygen_fraction:
      control: ambient
