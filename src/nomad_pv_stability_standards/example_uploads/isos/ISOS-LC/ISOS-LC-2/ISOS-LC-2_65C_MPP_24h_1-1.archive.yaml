data:
  m_def: nomad_pv_stability_standards.schema_packages.standard.StabilityStandard
  name: ISOS-LC-2
  variant: 65 °C, MPP, 24 h, 1:1
  reference: https://doi.org/10.1038/s41560-019-0529-5
  notes: 'Light–dark cycling under a solar simulator at elevated temperature in ambient
    air.


    "Options of exposure under open-circuit condition or using a fixed voltage bias
    near the MPP (instead of active MPP tracking)" (p. 37); MPP tracking is "encouraged
    … whenever possible" (p. 37).


    "Cycle periods of 2, 8, or 24 h and duty cycles (light:dark) of 1:1 or 1:2" (p.
    39). The light is on for the active duration of each period and off for the rest.
    "Ideally, light sources with an irradiance of 800–1000 W m–² (1 sun = 1000 W m–²)
    should be applied" (p. 43), read as the range the light is held in.'
  thermal_channel:
  - temperature:
      control: controlled
      minimum: 338.15
      maximum: 338.15
  opto_electrical_channel:
  - notes: 'Periodic J–V scan (p. 37) at an interval the standard does not state:
      it "depends on the characteristic degradation timescale of each given device"
      (p. 43).'
    light: solar_simulator
    voltage:
      control: swept
    current_density:
      monitored: true
  - notes: MPP tracking "measures the output" while it holds the point (p. 43).
    voltage:
      control: tracked
      monitored: true
      target: MPP
    current_density:
      monitored: true
  - period: 86400.0
    active_duration: 43200.0
    light: solar_simulator
    irradiance:
      control: controlled
      minimum: 800.0
      maximum: 1000.0
  atmosphere_channel:
  - gas: air
    relative_humidity:
      control: ambient
      monitored: true
    oxygen_fraction:
      control: ambient
